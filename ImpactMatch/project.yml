name: ImpactMatch
options:
  bundleIdPrefix: com.impactmatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ImpactMatch:
    type: application
    platform: iOS
    sources:
      - path: ImpactMatch
    info:
      path: ImpactMatch/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          ImpactMatch usa tu ubicación para mostrarte personas y
          organizaciones cerca de ti en el mapa.
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.impactmatch.ImpactMatch
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
